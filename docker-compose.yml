version: "3.8"
services:
    nats:
        image: nats:latest
        ports:
            - "4222:4222"
            - "8222:8222"
        command: "-js -d /data"
        volumes:
            - nats_data:/data
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "-q",
                    "--spider",
                    "http://localhost:8222/healthz",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    nats_data:
