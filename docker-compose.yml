version: "3.8"
services:
    nats:
        image: nats:latest
        ports:
            - "4222:4222"
            - "8222:8222"
        command: "-js -d /data"
        volumes:
            - nats_data:/data
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "-q",
                    "--spider",
                    "http://localhost:8222/healthz",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    postgres:
        image: postgres:16
        environment:
            POSTGRES_DB: songju_metadata
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 3s
            retries: 5

    agent:
        build:
            context: .
            dockerfile: Dockerfile.agent
        depends_on:
            nats:
                condition: service_started
            postgres:
                condition: service_healthy
        environment:
            NATS_URL: nats://nats:4222
            POSTGRES_HOST: postgres
            POSTGRES_PASSWORD: postgres
        restart: unless-stopped

volumes:
    nats_data:
    postgres_data:
